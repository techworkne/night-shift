<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Night-Shift</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div id="layout">
        <div id="buffs">
            <h3>Бонусы</h3>
            <div class="buff" id="buff-battery">
                <div><b>Батарейка</b><br>+50% заряда фонарика</div>
            </div>
            <div class="buff" id="buff-coffee">
                <div><b>Кофе</b><br>ускорение на 5 секунд</div>
            </div>
            <div class="buff" id="buff-omamori">
                <div><b>Омамори</b><br>спасает от одного касания</div>
            </div>
        </div>

        <div id="center">
            <div id="goal"></div>
            <canvas id="canvas" width="320" height="192"></canvas>
        </div>

        <div id="hud">
            <span>Уровень: <span id="hud-level">1</span>/2</span>
            <span>Задачи: <span id="hud-tasks">0/0</span></span>
            <span>Фонарик: <span id="hud-battery">100</span>%</span>
            <span>Очки: <span id="hud-score">0</span></span>
            <span id="hud-msg"></span>
        </div>
    </div>
    <script src="./js/managers/mapManager.js"></script>
    <script src="./js/managers/spriteManager.js"></script>
    <script src="./js/managers/eventsManager.js"></script>
    <script src="./js/managers/physicManager.js"></script>
    <script src="./js/entities/Entity.js"></script>
    <script src="./js/entities/Player.js"></script>
    <script src="./js/entities/Visitor.js"></script>
    <script src="./js/entities/Battery.js"></script>
    <script src="./js/entities/Box.js"></script>
    <script src="./js/entities/Coffee.js"></script>
    <script src="./js/entities/Omamori.js"></script>
    <script src="./js/entities/Shelf.js"></script>
    <script src="./js/entities/Exit.js"></script>
    <script src="./js/lighting.js"></script>
    <script src="./js/managers/gameManager.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
